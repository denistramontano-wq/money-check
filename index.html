<style>
:root{
  --bg:#12141A;--sf:#1B1E27;--sf2:#262B3A;--ln:#303648;
  --tx:#F2F4F8;--mu:#A3ACBF;
  --blue:#3D8BFF;--red:#FF5C4D;--amber:#FFB020;--green:#22C58B;--violet:#8B5CF6;--pink:#FF4D9D;--cyan:#19C3E6;
  --sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--tx)}
.w6{font-weight:600}
.mu{color:var(--mu)}
.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green)}.violet{color:var(--violet)}
.ic{display:block;flex:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative;background:var(--bg)}
#hd{flex:none;background:var(--bg);padding-top:var(--st)}
#mn{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:104px}
.top{display:flex;align-items:center;height:56px;padding:0 8px}
.top .side{width:96px;display:flex;align-items:center}
.top .side.r{justify-content:flex-end}
.top h1{flex:1;text-align:center;font-size:17px;font-weight:600}
.ib{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.ib:active{background:var(--sf)}
.mnav{display:flex;align-items:center;height:48px;padding:0 8px}
.mnav .mlab{flex:1;text-align:center;font-size:17px}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--ln);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;height:48px;padding:0 16px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--red)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 8px;border-bottom:1px solid var(--ln);text-align:center}
.sum .l{font-size:13px;color:var(--mu)}
.sum .v{font-size:17px;font-weight:600}
.sum .d{font-size:12px;color:var(--mu)}
.dh{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--sf);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.dh .n{font-size:24px;font-weight:600;min-width:32px}
.chip{font-size:13px;padding:0 8px;border-radius:8px;background:var(--sf2);color:var(--tx)}
.chip.sab{background:var(--blue)}.chip.dom{background:var(--red)}
.dh .sp{flex:1}
.dh .a{width:96px;text-align:right}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;padding:16px;min-height:64px}
.row:active{background:var(--sf)}
.row .cat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);overflow:hidden}
.row .cat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t1{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-size:15px;text-align:right;white-space:nowrap}
.row>div{min-width:0}
.empty{padding:48px 24px;text-align:center;color:var(--mu)}
.banner{display:flex;align-items:center;gap:16px;margin:16px;padding:16px;border-radius:16px;background:var(--sf);border:1px solid var(--amber)}
.banner .grow{flex:1}
.ver{padding:24px 16px;text-align:center;font-size:12px;color:var(--mu);user-select:none;-webkit-user-select:none}
#fab{position:absolute;right:16px;bottom:calc(64px + var(--sb) + 16px);width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;z-index:5}
#fab:active{opacity:.8}
#nv{flex:none;display:grid;grid-template-columns:repeat(5,1fr);height:calc(64px + var(--sb));padding-bottom:var(--sb);border-top:1px solid var(--ln);background:var(--bg)}
#nv button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;color:var(--mu)}
#nv button.on{color:var(--red)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr)}
.wd{padding:8px 0;text-align:center;font-size:12px;color:var(--mu);border-bottom:1px solid var(--ln)}
.cd{min-height:64px;padding:8px 0;text-align:center;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:0;font-size:10px;line-height:1.3;overflow:hidden}
.cd:nth-child(7n){border-right:0}
.cd .dn{font-size:13px;margin-bottom:0}
.cd.today .dn{background:var(--red);color:#fff;border-radius:8px;padding:0 8px}
.cd.sel{background:var(--sf2)}
.cd.out{opacity:.35}
.cd.dis{pointer-events:none}
.mrow{padding:16px;border-bottom:1px solid var(--ln)}
.mrow .h{display:flex;align-items:baseline;gap:8px}
.mrow .h .nm{flex:1;font-size:15px}
.bar{height:8px;border-radius:8px;background:var(--sf2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px}
.card{margin:16px;padding:16px;border-radius:16px;background:var(--sf);border:1px solid var(--ln)}
.big{font-size:32px;font-weight:600;line-height:1.2}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:0 16px 16px}
.seg button{height:48px;border-radius:8px;background:var(--sf);border:1px solid var(--ln);color:var(--mu)}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on.out{background:var(--red)}.seg button.on.in{background:var(--blue)}.seg button.on.tr{background:var(--violet)}
.sline{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--ln)}
.sline .grow{flex:1;min-width:0}
.dot{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sf2)}
.btn{height:48px;padding:0 24px;border-radius:8px;background:var(--red);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{opacity:.8}
.btn.sec{background:var(--sf2);color:var(--tx)}
.btn.ghost{background:none;border:1px solid var(--ln);color:var(--tx)}
.btn.del{background:none;border:1px solid var(--red);color:var(--red)}
.btn.sm{width:auto;height:40px;padding:0 16px}
.btn.blue{background:var(--blue)}
.list-btn{display:flex;align-items:center;gap:16px;width:100%;padding:16px;text-align:left;border-bottom:1px solid var(--ln)}
.list-btn:active{background:var(--sf)}
.list-btn .grow{flex:1}
#ov:empty{display:none}
.back{position:fixed;inset:0;background:rgba(0,0,0,.64);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.back.mid{align-items:center;padding:24px}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--sf);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--sb))}
.sheet.dlg{border-radius:16px;padding:24px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:16px;display:flex;align-items:center}
.sheet h2 span{flex:1}
.sheet .seg{padding:0 0 16px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
.fld input,.fld select{width:100%;height:48px;padding:0 16px;border-radius:8px;background:var(--sf2);border:1px solid var(--ln);appearance:none;-webkit-appearance:none}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--blue)}
.fld input.amt{height:64px;font-size:32px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;border-radius:8px;border:1px solid var(--ln);font-size:12px;min-height:72px;overflow:hidden;width:100%}
.cats button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats button.on{background:var(--sf2);border-color:var(--tx)}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cols button{height:32px;border-radius:8px;border:2px solid transparent}
.cols button.on{border-color:var(--tx)}
.acts{display:grid;gap:8px;margin-top:8px}
.acts.two{grid-template-columns:1fr 1fr}
.err{color:var(--red);font-size:13px;min-height:24px}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.lg{display:flex;gap:16px;padding:0 16px 16px;font-size:13px;color:var(--mu)}
.lg i{display:inline-block;width:16px;height:2px;margin-right:8px;vertical-align:middle}
.devpill{position:fixed;left:8px;bottom:calc(64px + var(--sb) + 8px);z-index:10;height:24px;padding:0 8px;border-radius:8px;background:var(--violet);color:#fff;font-size:12px}
.full{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding-top:var(--st);padding-bottom:calc(24px + var(--sb))}
.full .wrap{max-width:560px;margin:0 auto}
details{border-bottom:1px solid var(--ln)}
details summary{padding:16px;list-style:none;font-weight:600;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
details .in{padding:0 16px 16px}
pre{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;background:var(--sf);border-radius:8px;padding:16px;max-height:320px;overflow:auto}
.logl{font-size:12px;padding:8px 0;border-bottom:1px solid var(--ln);word-break:break-word}
</style>
</head>

const monthTx=(y,m)=>S.tx.filter(t=>t.d.startsWith(mkey(y,m)));
const yearTx=y=>S.tx.filter(t=>t.d.startsWith(y+'-'));
function totals(list){let i=0,o=0;list.forEach(t=>{if(t.t==='in')i+=t.a;else if(t.t==='out')o+=t.a});return{i,o,n:i-o}}
function balance(id){
  const a=acc(id);let b=a?a.init:0;
  S.tx.forEach(t=>{
    if(t.t==='in'&&t.acc===id)b+=t.a;
    else if(t.t==='out'&&t.acc===id)b-=t.a;
    else if(t.t==='tr'){if(t.acc===id)b-=t.a;if(t.acc2===id)b+=t.a}
  });
  return b;
}
const sortTx=l=>l.slice().sort((a,b)=>a.d===b.d?(b.ts||0)-(a.ts||0):(a.d<b.d?1:-1));
function deltaTxt(cur,prev,pm,cat){
  if(!prev)return cur&&cat?'nuova':'-';
  const d=Math.round((cur-prev)/prev*100);
  return (d>0?'+':'')+d+'% vs '+M3[pm];
}
/* rate */
function rateDue(p,i){
  const [y,m,d]=p.first.split('-').map(Number);
  const s=shiftM(y,m-1,i);
  return s.y+'-'+pad(s.m+1)+'-'+pad(Math.min(d,dIM(s.y,s.m)));
}
function rateInfo(p){
  const paid=new Set(p.paid);const due=[];let next=null;
  for(let i=0;i<p.n;i++){
    if(paid.has(i))continue;
    if(next===null)next=i;
    if(rateDue(p,i)<=today())due.push(i);
  }
  return{paid:paid.size,due,next,left:(p.n-paid.size)*p.amt,done:paid.size>=p.n};
}
const allDue=()=>{const r=[];S.rates.forEach(p=>rateInfo(p).due.forEach(i=>r.push([p,i])));return r};

}

function dayBlock(date,list){
  const d=new Date(date+'T00:00:00'),t=totals(list),w=GG[d.getDay()];
  return `<div class="dh"><span class="n">${d.getDate()}</span><span class="chip ${w==='sab'?'sab':w==='dom'?'dom':''}">${w}</span><span class="sp"></span><span class="a blue">${fmt(t.i)}</span><span class="a red">${fmt(t.o)}</span></div>${sortTx(list).map(txRow).join('')}`;
}
function groupByDay(list){
  const g={};list.forEach(t=>(g[t.d]=g[t.d]||[]).push(t));
  return Object.keys(g).sort().reverse().map(d=>dayBlock(d,g[d])).join('');
}
function dueBanner(){

function viewCal(){

function viewMonth(){

}
function trend(){
  const pts=[];
  for(let k=5;k>=0;k--){const s=shiftM(U.y,U.m,-k);const t=totals(monthTx(s.y,s.m));pts.push({l:M3[s.m],i:t.i,o:t.o})}
  const mx=Math.max(100,...pts.flatMap(p=>[p.i,p.o]))/100,mag=Math.pow(10,Math.floor(Math.log10(mx)));
  const top=Math.ceil(mx/mag)*mag*100;
  const W=320,H=176,L=40,R=8,T=8,B=24;
  const X=i=>L+i*(W-L-R)/5,Y=v=>T+(H-T-B)*(1-v/top);
  const lab=v=>{const e=v/100;return e>=1000?(e/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'k':String(Math.round(e))};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento ultimi 6 mesi">`;
  [0,.5,1].forEach(f=>{const y=Y(top*f);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#303648" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#A3ACBF">${lab(top*f)}</text>`});
  pts.forEach((p,i)=>{s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#A3ACBF">${p.l}</text>`});
  [['o','#FF8A7F'],['i','#7FB1FF']].forEach(([k,col])=>{
    s+=`<polyline fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+','+Y(p[k])).join(' ')}"/>`;
    pts.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p[k])}" r="2.5" fill="${col}"/>`});
  });
  return s+'</svg>';
}
function viewStat(){
  const p=shiftM(U.y,U.m,-1);
  const cur=monthTx(U.y,U.m).filter(t=>t.t===U.st),prev=monthTx(p.y,p.m).filter(t=>t.t===U.st);
  const tot=cur.reduce((s,t)=>s+t.a,0),ptot=prev.reduce((s,t)=>s+t.a,0);
  const g={},pg={};cur.forEach(t=>g[t.c]=(g[t.c]||0)+t.a);prev.forEach(t=>pg[t.c]=(pg[t.c]||0)+t.a);
  const rows=Object.keys(g).sort((a,b)=>g[b]-g[a]);
  let h=`<div class="card"><div class="mu" style="font-size:13px">${U.st==='out'?'Spese':'Entrate'} di ${MESI[U.m]}</div><div class="big ${U.st==='out'?'red':'blue'}">${fmt(tot)}</div><div class="mu" style="font-size:13px">${deltaTxt(tot,ptot,p.m)}</div></div>`;
  h+=rows.length?rows.map(id=>{const c=catOf(id),v=g[id];return `<div class="mrow">
      <div class="h"><span style="color:${c.color}">${ic(c.icon,20)}</span><span class="nm">${esc(c.name)}</span><span class="mu" style="font-size:13px">${Math.round(v/tot*100)}%</span><span>${fmt(v)}</span></div>

      <div class="mu" style="font-size:13px;margin-top:8px">${deltaTxt(v,pg[id]||0,p.m,1)}</div></div>`}).join(''):`<div class="empty">Nessun dato per questo mese</div>`;
  h+=`<div class="card" style="margin-top:24px"><div class="w6" style="margin-bottom:16px">Ultimi 6 mesi</div>${trend()}</div><div class="lg"><span><i style="background:#FF8A7F"></i>Spese</span><span><i style="background:#7FB1FF"></i>Entrate</span></div>`;
  return h;
}

    <div class="acts ${ed?'two':''}">${ed?'<button class="btn del" id="fx">Elimina</button>':''}<button class="btn" id="fs">Salva</button></div>`);
  draw();
  $('#sg').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;draw()};
  $('#fc').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;draw()};
  $('#fa1').onchange=()=>draw();
  $('#fs').onclick=()=>{
    const a=toCents($('#fm').value);
    if(!(a>0))return toast('Importo non valido');
    if(!$('#fd').value)return toast('Serve una data');
    if(!$('#fa1').value)return toast('Crea prima un conto');
    const t={id:ed?ed.id:uid(),ts:ed?ed.ts:Date.now(),d:$('#fd').value,t:type,a,acc:$('#fa1').value,note:$('#fn').value.trim()};
    if(type==='tr'){t.acc2=$('#fa2').value;if(!t.acc2||t.acc2===t.acc)return toast('Scegli due conti diversi')}
    else t.c=cat;
    if(ed&&ed.rid){t.rid=ed.rid;t.ri=ed.ri}
    if(ed){const i=S.tx.findIndex(x=>x.id===ed.id),b=clone(S.tx[i]);S.tx[i]=t;save();logC('modifica','movimento',b,t)}
    else{S.tx.push(t);save();logC('aggiunta','movimento',null,t)}
    closeSheet();
    const [y,m]=t.d.split('-').map(Number);
    if(U.tab==='reg'&&U.sub!=='month'){U.y=y;U.m=m-1;if(U.sub==='cal')U.sel=t.d}
    render(true);toast('Salvato');
  };
  if(ed)$('#fx').onclick=async()=>{
    if(!await confirmBox('Eliminare questo movimento?','Elimina'))return;
    delTx(ed.id);closeSheet();render(true);toast('Eliminato');
  };
  if(!ed){try{$('#fm').focus()}catch(e){}}
}
function delTx(id){
  const i=S.tx.findIndex(t=>t.id===id);if(i<0)return;
  const b=S.tx[i];S.tx.splice(i,1);
  if(b.rid){const p=S.rates.find(r=>r.id===b.rid);if(p){const before=clone(p);p.paid=p.paid.filter(x=>x!==b.ri);logC('modifica','rata (registrazione annullata)',before,p)}}
  save();logC('eliminazione','movimento',b,null);
}

/* conti */
function accSheet(id){
  const ed=id?acc(id):null,used=ed?S.tx.some(t=>t.acc===id||t.acc2===id)||S.rates.some(r=>r.acc===id):false;
  sheet(`<h2><span>${ed?'Modifica conto':'Nuovo conto'}</span><button class="ib" data-act="back" aria-label="Chiudi">${ic('x')}</button></h2>
    <div class="fld"><label for="an">Nome</label><input id="an" value="${esc(ed?ed.name:'')}" autocomplete="off"></div>
    <div class="fld"><label for="ai">Saldo iniziale</label><input id="ai" inputmode="decimal" placeholder="0,00" value="${ed?fmtN(ed.init).replace(/\./g,''):''}"></div>
    ${ed&&used?'<div class="mu" style="font-size:13px;margin-bottom:16px">Ha movimenti collegati: non si può eliminare.</div>':''}
    <div class="acts ${ed&&!used?'two':''}">${ed&&!used?'<button class="btn del" id="ax">Elimina</button>':''}<button class="btn" id="as">Salva</button></div>`);
  $('#as').onclick=()=>{
    const n=$('#an').value.trim();if(!n)return toast('Serve un nome');
    const raw=$('#ai').value.trim(),init=raw?toCents(raw):0;if(isNaN(init))return toast('Saldo non valido');
    if(ed){const b=clone(ed);ed.name=n;ed.init=init;save();logC('modifica','conto',b,ed)}
    else{const a={id:uid(),name:n,init};S.accounts.push(a);save();logC('aggiunta','conto',null,a)}
    closeSheet();render(true);toast('Salvato');
  };
  if(ed&&!used)$('#ax').onclick=async()=>{
    if(!await confirmBox('Eliminare il conto '+esc(ed.name)+'?','Elimina'))return;
    S.accounts=S.accounts.filter(a=>a.id!==ed.id);save();logC('eliminazione','conto',ed,null);closeSheet();render(true);
  };
}

/* rate */
function rateSheet(id){
  const ed=id?S.rates.find(r=>r.id===id):null;
  const outs=S.cats.filter(c=>c.type==='out');
  sheet(`<h2><span>${ed?'Modifica rata':'Nuova rata'}</span><button class="ib" data-act="back" aria-label="Chiudi">${ic('x')}</button></h2>
    <div class="fld"><label for="rn">Nome</label><input id="rn" placeholder="Es. Telefono, auto, prestito" value="${esc(ed?ed.name:'')}" autocomplete="off"></div>
    <div class="two"><div class="fld"><label for="ra">Importo rata</label><input id="ra" inputmode="decimal" placeholder="0,00" value="${ed?fmtN(ed.amt).replace(/\./g,''):''}"></div>
    <div class="fld"><label for="rt">Numero rate</label><input id="rt" inputmode="numeric" placeholder="12" value="${ed?ed.n:''}"></div></div>
    <div class="two"><div class="fld"><label for="rf">Prima scadenza</label><input id="rf" type="date" value="${ed?ed.first:today()}"></div>
    ${ed?'':'<div class="fld"><label for="rp">Già pagate</label><input id="rp" inputmode="numeric" placeholder="0" value="0"></div>'}</div>
    <div class="two"><div class="fld"><label for="rc">Conto</label><select id="rc">${accOpts(ed?ed.acc:(S.accounts[0]||{}).id)}</select></div>
    <div class="fld"><label for="rg">Categoria</label><select id="rg">${outs.map(c=>`<option value="${c.id}" ${c.id===(ed?ed.cat:'rate')?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="acts ${ed?'two':''}">${ed?'<button class="btn del" id="rx">Elimina</button>':''}<button class="btn" id="rs">Salva</button></div>`);
  $('#rs').onclick=()=>{
    const name=$('#rn').value.trim(),amt=toCents($('#ra').value),n=parseInt($('#rt').value,10);
    if(!name)return toast('Serve un nome');
    if(!(amt>0))return toast('Importo non valido');
    if(!(n>0&&n<=600))return toast('Numero rate non valido');
    if(!$('#rf').value)return toast('Serve la prima scadenza');
    if(!$('#rc').value)return toast('Crea prima un conto');
    if(ed){
      const b=clone(ed);
      Object.assign(ed,{name,amt,n,first:$('#rf').value,acc:$('#rc').value,cat:$('#rg').value});
      ed.paid=ed.paid.filter(i=>i<n);
      save();logC('modifica','rata',b,ed);
    }else{
      const k=Math.min(n,Math.max(0,parseInt($('#rp').value,10)||0));
      const p={id:uid(),name,amt,n,first:$('#rf').value,acc:$('#rc').value,cat:$('#rg').value,paid:Array.from({length:k},(_,i)=>i)};
      S.rates.push(p);save();logC('aggiunta','rata',null,p);
    }
    closeSheet();render(true);toast('Salvato');
  };
  if(ed)$('#rx').onclick=async()=>{
    if(!await confirmBox('Eliminare la rata '+esc(ed.name)+'? I movimenti già registrati restano.','Elimina'))return;
    S.rates=S.rates.filter(r=>r.id!==ed.id);save();logC('eliminazione','rata',ed,null);closeSheet();render(true);
  };
}
function payRate(id){
  const p=S.rates.find(r=>r.id===id);if(!p)return;
  const before=clone(p),r=rateInfo(p);
  r.due.forEach(i=>{
    const t={id:uid(),ts:Date.now()+i,d:rateDue(p,i),t:'out',a:p.amt,acc:p.acc,c:p.cat||'rate',note:p.name+' ('+(i+1)+'/'+p.n+')',rid:p.id,ri:i};
    S.tx.push(t);p.paid.push(i);logC('aggiunta','movimento (rata)',null,t);
  });
  save();logC('modifica','rata',before,p);
  render(true);toast(r.due.length>1?'Rate registrate':'Rata registrata');
}

/* categorie */
function catsSheet(){
  const row=c=>`<button class="list-btn" data-act="editcat" data-id="${c.id}"><span class="dot" style="color:${c.color}">${ic(c.icon,20)}</span><span class="grow">${esc(c.name)}</span>${ic('chr',20)}</button>`;
  sheet(`<h2><span>Categorie</span><button class="ib" data-act="back" aria-label="Chiudi">${ic('x')}</button></h2>
    <div class="mu" style="font-size:13px;margin-bottom:8px">Uscite</div>${S.cats.filter(c=>c.type==='out').map(row).join('')}
    <div class="mu" style="font-size:13px;margin:16px 0 8px">Entrate</div>${S.cats.filter(c=>c.type==='in').map(row).join('')}
    <div class="acts" style="margin-top:16px"><button class="btn" data-act="addcat">${ic('plus',20)}Nuova categoria</button></div>`);
}
function catSheet(id){
  const ed=id?S.cats.find(c=>c.id===id):null;
  let icon=ed?ed.icon:'tag',color=ed?ed.color:COL_PICK[0],type=ed?ed.type:'out';
  const used=ed?S.tx.filter(t=>t.c===id).length+S.rates.filter(r=>r.cat===id).length:0;
  sheet(`<h2><span>${ed?'Modifica categoria':'Nuova categoria'}</span><button class="ib" data-act="back" aria-label="Chiudi">${ic('x')}</button></h2>
    <div class="fld"><label for="cn">Nome</label><input id="cn" value="${esc(ed?ed.name:'')}" autocomplete="off"></div>
    ${ed?'':`<div class="seg" id="ct"><button type="button" class="out on" data-t="out">Uscita</button><button type="button" class="in" data-t="in">Entrata</button></div>`}
    <div class="fld"><label>Icona</label><div class="cats" id="ci"></div></div>
    <div class="fld"><label>Colore</label><div class="cols" id="cc"></div></div>
    ${ed&&used?`<div class="mu" style="font-size:13px;margin-bottom:16px">Usata in ${used} elementi: non si può eliminare.</div>`:''}
    <div class="acts ${ed&&!used?'two':''}">${ed&&!used?'<button class="btn del" id="cx">Elimina</button>':''}<button class="btn" id="cs">Salva</button></div>`);
  const draw=()=>{
    $('#ci').innerHTML=ICON_PICK.map(n=>`<button type="button" class="${n===icon?'on':''}" data-i="${n}" style="min-height:48px;color:${color}">${ic(n,24)}</button>`).join('');
    $('#cc').innerHTML=COL_PICK.map(c=>`<button type="button" class="${c===color?'on':''}" data-c="${c}" style="background:${c}" aria-label="colore"></button>`).join('');
  };
  draw();
  $('#ci').onclick=e=>{const b=e.target.closest('button');if(b){icon=b.dataset.i;draw()}};
  $('#cc').onclick=e=>{const b=e.target.closest('button');if(b){color=b.dataset.c;draw()}};
  if(!ed)$('#ct').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;document.querySelectorAll('#ct button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#cs').onclick=()=>{
    const name=$('#cn').value.trim();if(!name)return toast('Serve un nome');
    if(ed){const b=clone(ed);Object.assign(ed,{name,icon,color});save();logC('modifica','categoria',b,ed)}
    else{const c={id:uid(),name,icon,color,type};S.cats.push(c);save();logC('aggiunta','categoria',null,c)}
    catsSheet();render(true);
  };
  if(ed&&!used)$('#cx').onclick=async()=>{
    if(!await confirmBox('Eliminare la categoria '+esc(ed.name)+'?','Elimina'))return;
    S.cats=S.cats.filter(c=>c.id!==ed.id);save();logC('eliminazione','categoria',ed,null);catsSheet();render(true);
  };
}

/* backup */
function download(name,text,type){
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1000);
}
const stamp=()=>ymd(new Date());
function exportJson(){download('spese-backup-'+stamp()+'.json',JSON.stringify({app:'spese',ver:VER,data:S},null,1),'application/json');toast('Backup salvato')}
function exportCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Data','Tipo','Categoria','Conto','Verso','Importo','Nota'].map(q).join(';')];
  sortTx(S.tx).forEach(t=>rows.push([t.d,t.t==='in'?'Entrata':t.t==='out'?'Uscita':'Trasferimento',t.t==='tr'?'':catOf(t.c).name,accName(t.acc),t.acc2?accName(t.acc2):'',(t.a/100).toFixed(2).replace('.',','),t.note].map(q).join(';')));
  download('spese-movimenti-'+stamp()+'.csv','﻿'+rows.join('\r\n'),'text/csv;charset=utf-8');toast('File creato');
}
function importJson(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const j=JSON.parse(r.result),d=j.data||j;
      if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.tx)||!Array.isArray(d.cats))throw new Error('formato');
      if(!await confirmBox(`Ripristinare il backup? Verranno sostituiti i dati attuali (${S.tx.length} movimenti) con quelli del file (${d.tx.length} movimenti).`,'Ripristina'))return;
      const b={movimenti:S.tx.length,conti:S.accounts.length,rate:S.rates.length};
      d.rates=d.rates||[];S=d;save();
      logC('importazione','backup',b,{movimenti:S.tx.length,conti:S.accounts.length,rate:S.rates.length});
      render();toast('Backup ripristinato');
    }catch(e){toast('File non valido')}
  };
  r.readAsText(file);
}

/* ---------- modalità sviluppo (nascosta) ---------- */
const hash=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return String(4294967296*(2097151&h2)+(h1>>>0))};
const pwOk=v=>{const s=ls.get(K.pw);return s?hash(v)===s:v==='admin1234'};
const devOn=()=>ls.get(K.dev)==='1';
function renderDevPill(){
  let b=$('#devpill');
  if(devOn()){
    if(!b){b=document.createElement('button');b.id='devpill';b.className='devpill';b.textContent='dev';b.dataset.act='devopen';document.body.appendChild(b)}
  }else if(b)b.remove();
}
let taps=[];
function verTap(){
  const n=Date.now();taps=taps.filter(t=>n-t<4000);taps.push(n);
  if(taps.length>=7){taps=[];devToggle()}
}
async function devToggle(){
  if(devOn()){ls.del(K.dev);renderDevPill();$('#dev')&&$('#dev').remove();toast('Disattivata');return}
  sheet(`<h2><span>Accesso</span></h2><div class="fld"><input id="dp" type="password" placeholder="Password" autocomplete="off"></div><div class="err" id="de"></div><div class="acts two"><button class="btn sec" data-act="back">Annulla</button><button class="btn" id="dk">Entra</button></div>`,{mid:true});
  const go=()=>{
    if(pwOk($('#dp').value)){ls.set(K.dev,'1');closeSheet();renderDevPill();devPanel()}
    else{$('#de').textContent='Password errata';$('#dp').value=''}
  };
  $('#dk').onclick=go;$('#dp').onkeydown=e=>{if(e.key==='Enter')go()};
  try{$('#dp').focus()}catch(e){}
}
function devPanel(){
  const old=$('#dev');if(old)old.remove();
  const L=jget(K.log,[]),keys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);keys.push([k,(localStorage.getItem(k)||'').length])}}catch(e){}
  const d=document.createElement('div');d.id='dev';d.className='full';
  d.innerHTML=`<div class="wrap">
    <div class="top"><div class="side"></div><h1>Sviluppo</h1><div class="side r"><button class="ib" data-act="devclose" aria-label="Chiudi">${ic('x')}</button></div></div>
    <div class="sline"><div class="grow"><div class="w6">Versione</div><div class="mu">v${VER}</div></div></div>
    <details open><summary>Log modifiche (${L.length})</summary><div class="in">
      <div class="acts two" style="margin-bottom:16px"><button class="btn sec sm" data-act="logtxt">Esporta TXT</button><button class="btn sec sm" data-act="logjson">Esporta JSON</button></div>
      <div style="max-height:320px;overflow:auto">${L.slice().reverse().slice(0,300).map(e=>`<div class="logl"><span class="mu">${esc(e.t.replace('T',' ').slice(0,19))}</span> · <span class="w6">${esc(e.a)}</span> · ${esc(e.i)}<br><span class="mu">prima:</span> ${esc(e.b==null?'-':JSON.stringify(e.b))}<br><span class="mu">dopo:</span> ${esc(e.n==null?'-':JSON.stringify(e.n))}</div>`).join('')||'<div class="mu">Nessuna modifica registrata</div>'}</div>
      <div class="acts" style="margin-top:16px"><button class="btn del sm" data-act="logclr">Svuota il log</button></div></div></details>
    <details><summary>Errori e console (${ERR.length})</summary><div class="in"><pre>${esc(ERR.slice().reverse().map(e=>e.t.slice(11,19)+' ['+e.l+'] '+e.m).join('\n')||'Nessun errore')}</pre></div></details>
    <details><summary>Archivio locale</summary><div class="in"><div class="mu" style="margin-bottom:8px">${keys.map(k=>esc(k[0])+': '+k[1]+' caratteri').join('<br>')||'-'}</div><pre>${esc(JSON.stringify(S,null,1).slice(0,20000))}</pre></div></details>
    <details><summary>Dati</summary><div class="in"><div class="acts"><button class="btn sec" data-act="exp">Esporta dati JSON</button></div></div></details>
    <details><summary>Password</summary><div class="in"><div class="fld"><input id="np" type="password" placeholder="Nuova password" autocomplete="off"></div><div class="acts"><button class="btn sec" data-act="devpw">Cambia password</button></div></div></details>
    <details><summary>Pulizia</summary><div class="in"><div class="acts"><button class="btn del" data-act="devwipe">Svuota cache e dati locali</button><button class="btn sec" data-act="devoff">Disattiva modalità</button></div></div></details>
  </div>`;
  document.body.appendChild(d);
}

/* ---------- eventi ---------- */
const A={
  back(el,e){if(e.target===el||el.tagName==='BUTTON')closeSheet()},
  tab(el){U.tab=el.dataset.k;if(U.tab!=='reg'){U.searching=false}render();$('#mn').scrollTop=0},
  prev(){if(U.tab==='reg'&&U.sub==='month'){U.y--}else{const s=shiftM(U.y,U.m,-1);U.y=s.y;U.m=s.m}render()},
  next(){if(U.tab==='reg'&&U.sub==='month'){U.y++}else{const s=shiftM(U.y,U.m,1);U.y=s.y;U.m=s.m}render()},
  now(){U.y=now0.getFullYear();U.m=now0.getMonth();render()},
  sub(el){U.sub=el.dataset.k;render();$('#mn').scrollTop=0},
  stype(el){U.st=el.dataset.k;render()},
  search(){U.searching=!U.searching;U.q='';render();if(U.searching){const q=$('#q');q&&q.focus()}},
  add(el){txSheet(null,el.id==='fab'&&U.sub==='cal'&&!U.searching?U.sel:null)},
  edit(el){txSheet(el.dataset.id)},
  seld(el){U.sel=el.dataset.d;renderMn(true)},
  gomonth(el){U.m=+el.dataset.m;U.sub='day';render();$('#mn').scrollTop=0},
  addacc(){accSheet()},editacc(el){accSheet(el.dataset.id)},
  addrate(){rateSheet()},editrate(el){rateSheet(el.dataset.id)},payrate(el){payRate(el.dataset.id)},
  cats(){catsSheet()},addcat(){catSheet()},editcat(el){catSheet(el.dataset.id)},
  exp(){exportJson()},csv(){exportCsv()},imp(){const f=$('#file');f.value='';f.click()},
  devopen(){devPanel()},devclose(){const d=$('#dev');d&&d.remove()},
  logtxt(){download('log-modifiche-'+stamp()+'.txt',logTxt(jget(K.log,[])),'text/plain')},
  logjson(){download('log-modifiche-'+stamp()+'.json',JSON.stringify(jget(K.log,[]),null,1),'application/json')},
  async logclr(){if(await confirmBox('Svuotare il log delle modifiche? Non si può annullare.','Svuota')){ls.set(K.log,'[]');devPanel()}},
  devpw(){const v=$('#np').value;if(v.length<4)return toast('Minimo 4 caratteri');ls.set(K.pw,hash(v));$('#np').value='';toast('Password aggiornata')},
  devoff(){ls.del(K.dev);A.devclose();renderDevPill()},
  async devwipe(){
    if(!await confirmBox('Cancellare tutti i dati locali e la cache? I movimenti andranno persi.','Cancella'))return;
    const b={movimenti:S.tx.length,conti:S.accounts.length,rate:S.rates.length};
    S=seed();save();logC('reset','dati locali',b,{movimenti:0,conti:S.accounts.length,rate:0});
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
    try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}
    A.devclose();render();toast('Fatto');
  }
};
document.addEventListener('click',e=>{
  if(e.target.closest('.ver')){verTap();return}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){U.q=e.target.value;renderMn()}});
document.addEventListener('change',e=>{if(e.target.id==='file'&&e.target.files[0])importJson(e.target.files[0])});

/* ---------- avvio ---------- */
render();
(function pwa(){
  try{
    const man={name:'Spese',short_name:'Spese',start_url:location.href.split('#')[0],display:'standalone',background_color:'#12141A',theme_color:'#12141A',lang:'it',icons:[{src:'data:image/png;base64,'+ICON64,sizes:'192x192',type:'image/png',purpose:'any'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l);
  }catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
